name: Verify and publish margin history

on:
  schedule:
    - cron: '15 12,14,23 * * *'
    - cron: '41 6 9 11 *' # temporary verification
  workflow_dispatch:
    inputs:
      through:
        description: Optional fetch cutoff, YYYY-MM-DD
        type: string
      restore_snapshot:
        description: Restore an existing 64-character snapshot ID
        type: string

concurrency:
  group: margin-pages
  cancel-in-progress: false

permissions: {}

env:
  PAGES_URL: https://idiego8gs.github.io/taiwan-margin-monitor
  SITE_RELEASE: site-state-v1

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: site-compute
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.data.outputs.deploy }}
      snapshot: ${{ steps.data.outputs.snapshot }}
      checkpoint_artifact: ${{ steps.seal.outputs.artifact }}
      checkpoint_sha256: ${{ steps.seal.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r backend/requirements-site.lock
      - name: Download encrypted checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_SNAPSHOT: ${{ inputs.restore_snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          echo "SITE_TEMP=$work" >> "$GITHUB_ENV"
          http="$(curl --silent --show-error --location --retry 2 --max-time 45 \
            --write-out '%{http_code}' --output "$work/live.json" "$PAGES_URL/data/latest.json")"
          live=""
          case "$http" in
            200) live="$(jq -er '.snapshot_id | select(test("^[a-f0-9]{64}$"))' "$work/live.json")";;
            404) ;;
            *) echo "::error::Cannot confirm published snapshot ($http)"; exit 1;;
          esac
          selected="${RESTORE_SNAPSHOT:-$live}"
          if [[ -n "$selected" && ! "$selected" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid snapshot ID"
            exit 1
          fi
          asset="state-${selected:-bootstrap}.json.gz.enc"
          gh release download "$SITE_RELEASE" --pattern "$asset" --dir "$work"
          echo "SITE_INPUT=$work/$asset" >> "$GITHUB_ENV"
          echo "SITE_LIVE=$live" >> "$GITHUB_ENV"
      - name: Decrypt checkpoint
        env:
          SITE_STATE_KEY: ${{ secrets.SITE_STATE_KEY }}
        run: node scripts/site-state.mjs open "$SITE_INPUT" "$SITE_TEMP/seed.json.gz"
      - name: Fetch, validate and calculate
        id: data
        env:
          FETCH_THROUGH: ${{ inputs.through }}
          RESTORE_SNAPSHOT: ${{ inputs.restore_snapshot }}
          SITE_WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONPATH: backend
        shell: bash
        run: |
          set -euo pipefail
          work="$SITE_TEMP"
          if [[ -n "$RESTORE_SNAPSHOT" ]]; then
            python -m app.site_snapshot --root "$work/data" --seed "$work/seed.json.gz"
            cp "$work/seed.json.gz" "$work/next.json.gz"
          else
            cutoff=()
            if [[ -n "$FETCH_THROUGH" ]]; then cutoff=(--through "$FETCH_THROUGH"); fi
            python -m app.site_update --seed "$work/seed.json.gz" \
              --output "$work/next.json.gz" --root "$work/data" "${cutoff[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          snapshot="$(jq -er '.snapshot_id | select(test("^[a-f0-9]{64}$"))' "$work/data/latest.json")"
          if [[ -n "$RESTORE_SNAPSHOT" && "$snapshot" != "$RESTORE_SNAPSHOT" ]]; then
            echo "::error::Restored snapshot fingerprint differs from the requested version."
            exit 1
          fi
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          if [[ "$snapshot" == "$SITE_LIVE" && "$GITHUB_EVENT_NAME" == schedule ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Inspect checkpoint before encryption
        if: steps.data.outputs.deploy == 'true'
        run: python scripts/verify-site-export.py seed "$SITE_TEMP/next.json.gz"
      - name: Seal checkpoint for the separate upload job
        id: seal
        if: steps.data.outputs.deploy == 'true'
        env:
          SITE_STATE_KEY: ${{ secrets.SITE_STATE_KEY }}
          SNAPSHOT_ID: ${{ steps.data.outputs.snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          asset="state-$SNAPSHOT_ID.json.gz.enc"
          node scripts/site-state.mjs seal "$SITE_TEMP/next.json.gz" "$SITE_TEMP/$asset"
          echo "artifact=encrypted-state-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$SITE_TEMP/$asset" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Remove plaintext checkpoints
        if: always() && env.SITE_TEMP != ''
        run: rm -f -- "$SITE_TEMP/seed.json.gz" "$SITE_TEMP/next.json.gz"
      - name: Verify stock files and build static pages
        if: steps.data.outputs.deploy == 'true'
        run: |
          npm ci --ignore-scripts
          python scripts/build-site.py "$SITE_TEMP/data" "$SITE_TEMP/pages"
          python scripts/verify-site-export.py pages "$SITE_TEMP/pages"
          tar -cf "$SITE_TEMP/artifact.tar" -C "$SITE_TEMP/pages" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.data.outputs.deploy == 'true'
        with:
          name: github-pages
          path: ${{ env.SITE_TEMP }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.data.outputs.deploy == 'true'
        with:
          name: ${{ steps.seal.outputs.artifact }}
          path: ${{ env.SITE_TEMP }}/state-${{ steps.data.outputs.snapshot }}.json.gz.enc
          retention-days: 1
          if-no-files-found: error

  checkpoint:
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare.outputs.checkpoint_artifact }}
          path: ${{ runner.temp }}/checkpoint
      - name: Save only the authenticated ciphertext
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ID: ${{ needs.prepare.outputs.snapshot }}
          CHECKPOINT_SHA256: ${{ needs.prepare.outputs.checkpoint_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SNAPSHOT_ID" =~ ^[a-f0-9]{64}$ && "$CHECKPOINT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          asset="state-$SNAPSHOT_ID.json.gz.enc"
          file="$RUNNER_TEMP/checkpoint/$asset"
          printf '%s  %s\n' "$CHECKPOINT_SHA256" "$file" | sha256sum --check
          [[ "$(head -c 4 "$file")" == TWM1 ]]
          names="$(gh release view "$SITE_RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if ! grep -Fxq "$asset" <<< "$names"; then
            gh release upload "$SITE_RELEASE" "$file" --repo "$GITHUB_REPOSITORY"
            digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SITE_RELEASE" \
              --jq ".assets[] | select(.name == \"$asset\") | .digest")"
            [[ "$digest" == "sha256:$CHECKPOINT_SHA256" ]]
          fi

  publish:
    needs: [prepare, checkpoint]
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
      - name: Verify the public version and a stock history
        env:
          SNAPSHOT_ID: ${{ needs.prepare.outputs.snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if [[ "$(curl -fsS --max-time 15 "$PAGES_URL/data/latest.json?$SNAPSHOT_ID" | jq -r .snapshot_id || true)" == "$SNAPSHOT_ID" ]]; then
              index="$(curl -fsS "$PAGES_URL/data/snapshots/$SNAPSHOT_ID/index.json")"
              jq -e --arg version "$SNAPSHOT_ID" '.snapshot_id == $version and (.stocks | length == 500)' <<< "$index"
              sid="$(jq -er '.stocks[0].security_id' <<< "$index")"
              expected="$(jq -er '.stocks[0].history_sha256' <<< "$index")"
              curl -fsS "$PAGES_URL/stocks/s-$sid/" >/dev/null
              curl -fsS "$PAGES_URL/data/snapshots/$SNAPSHOT_ID/stocks/$sid.json" | sha256sum --check <(printf '%s  -\n' "$expected")
              echo "Public snapshot verified: $SNAPSHOT_ID" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The public site did not confirm the intended version."
          exit 1
